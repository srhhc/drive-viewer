name: 🔄 עדכון יומי — סריקת Google Drive

on:
  schedule:
    # כל יום ב-06:00 UTC (09:00 שעון ישראל)
    - cron: '0 6 * * *'
  workflow_dispatch:  # הרצה ידנית
  push:
    branches:
      - main
    paths:
      - 'scripts/generate-manifest.js'
      - '.github/workflows/update-manifest.yml'

permissions:
  contents: write
  pages: write
  id-token: write

# Prevent concurrent scans from conflicting on the git push
concurrency:
  group: drive-scan
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🔍 סריקת תיקיות Google Drive
        working-directory: ./scripts
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          DRIVE_FOLDER_IDS: ${{ secrets.DRIVE_FOLDER_IDS }}
        run: node generate-manifest.js

      - name: 📝 Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/

          # Only commit if data actually changed
          if git diff --cached --quiet; then
            echo "✅ No changes to data files."
          else
            git commit -m "🔄 עדכון יומי — רענון קבצים מ-Google Drive ($(date '+%Y-%m-%d'))"
            # force-with-lease: safe because data/ is auto-generated and never hand-edited
            git push --force-with-lease origin main
          fi

      - name: 🚀 Trigger Pages deployment
        if: success()
        run: |
          echo "Manifest updated successfully. GitHub Pages will auto-deploy."
